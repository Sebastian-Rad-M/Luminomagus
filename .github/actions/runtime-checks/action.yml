name: 'Runtime checks'
description: 'Run dynamic analysis tools'

runs:
  using: "composite"
  steps:
    - name: Sanitizers
      shell: bash
      # run one sanitizer for each env to avoid building extra binaries on one env
      if: matrix.runs_asan == true && runner.os != 'Windows'
      # detect_leaks is not supported on macOS
      # env:
      #   ASAN_OPTIONS: detect_leaks=1
      run: |
        cat "${INPUT_FILENAME}" | tr -d '\r' | ./${{ env.ZIP_NAME }}/"${EXECUTABLE_NAME}"

    - name: Sanitizers (Windows MSVC)
      shell: bash
      # run one sanitizer for each OS to avoid building extra binaries
      if: matrix.cxx == 'cl' && matrix.runs_asan == true
      continue-on-error: true
      run: |
        cat "${INPUT_FILENAME}" | ./${{ env.ZIP_NAME }}/"${EXECUTABLE_NAME}".exe
    - name: Run with Virtual Display
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # 1. Install the virtual framebuffer
        sudo apt-get update && sudo apt-get install -y xvfb
        
        # 2. DEBUG: Print the contents of the directory so we can see if the file is actually there
        echo "Checking contents of ${{ env.ZIP_NAME }}:"
        ls -la ./${{ env.ZIP_NAME }}/
        
        # 3. Add execution permissions just in case it was lost during the move
        chmod +x ./${{ env.ZIP_NAME }}/"${{ env.EXECUTABLE_NAME }}"
        
        # 4. Correctly pipe the inputs INTO the xvfb-wrapped game
        cat "${INPUT_FILENAME}" | tr -d '\r' | xvfb-run -a ./${{ env.ZIP_NAME }}/"${{ env.EXECUTABLE_NAME }}"
    - name: Valgrind
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_valgrind == true
      run: |
        bash ./scripts/run_valgrind.sh "${{ env.ZIP_NAME }}"
